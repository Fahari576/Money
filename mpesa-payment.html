<!DOCTYPE html>
<html>
<head>
<title>M-Pesa Paybill Deposit</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  background: linear-gradient(to bottom, #550088, #880055);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh; /* Make body take full viewport height */
  width: 100vw; /* Make body take full viewport width */
}

.container {
  background-color: #330055;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
  text-align: center;
  width: 90%; /* Increase width to be almost full screen */
  max-width: 600px; /* Adjust max-width as needed for larger screens */
  box-sizing: border-box; /* Include padding in the width calculation */
}

h1, h2 {
  margin-bottom: 10px;
}

input[type="number"],
input[type="text"] {
  width: calc(100% - 20px); /* Adjust width to account for padding */
  padding: 10px;
  margin-bottom: 10px;
  background-color: #440066;
  color: white;
  border: none;
  border-radius: 5px;
  text-align: center;
  box-sizing: border-box; /* Include padding in the width calculation */
}

button {
  background-color: #9900cc;
  color: white;
  padding: 15px 30px; /* Increase button padding for a larger size */
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1.1em; /* Make button text slightly larger */
}

.instructions {
  text-align: left;
  margin-top: 20px;
  padding: 15px; /* Increase padding for instructions */
  border: 1px solid #7700aa;
  border-radius: 5px;
  font-size: 1.1em; /* Make instruction text slightly larger */
}

.instructions ol {
  padding-left: 25px; /* Adjust padding for ordered list */
}

.input-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 15px; /* Increase margin between input groups */
}

.input-group label {
  margin-bottom: 8px; /* Increase margin for labels */
  font-size: 1.1em; /* Make label text slightly larger */
}
</style>
</head>
<body>
  <div class="container">
    <h1>M-Pesa Paybill Deposit</h1>

    <div class="instructions">
      <h2>Instructions:</h2>
      <ol>
        <li>Go to M-Pesa on your phone.</li>
        <li>Select "Lipa na M-Pesa".</li>
        <li>Choose "Pay Bill".</li>
        <li>Enter Business Number: <b>247247</b></li>
        <li>Enter Account Number: <b>20062359741</b></li>
        <li>Enter Account Name: <b>Dennis</b></li>
        <li>Enter your M-Pesa PIN.</li>
      </ol>
    </div>

    <div class="input-group">
      <label for="amount">Enter Amount:</label>
      <input type="number" id="amount" placeholder="Amount">
    </div>
    <div class="input-group">
      <label for="phoneNumber">Phone Number:</label>
      <input type="text" id="phoneNumber" placeholder="Phone Number">
    </div>
    <div class="input-group">
      <label for="transactionCode">Transaction Code:</label>
      <input type="text" id="transactionCode" placeholder="Transaction Code">
    </div>

    <button onclick="depositConfirmation()">Confirm Deposit</button>
  </div>

  <script>
    function depositConfirmation() {
      const amount = document.getElementById("amount").value;
      const phoneNumber = document.getElementById("phoneNumber").value;
      const transactionCode = document.getElementById("transactionCode").value;

      if (amount === "" || phoneNumber === "" || transactionCode === "") {
        alert("Please fill in all fields.");
        return;
      }

      alert("Thank you! Your deposit is being processed.\nAmount: " + amount + "\nPhone Number: " + phoneNumber + "\nTransaction Code: " + transactionCode + "\nPaybill Details:\nPaybill Number: 247247\nAccount Number: 20062359741\nAccount Name: Dennis");
      // In a real application, you would send this information to your server
      // to verify the payment.  This is just a placeholder.
    }
  </script>
</body>
</html>
