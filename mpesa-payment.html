<!DOCTYPE html>
<html>
<head>
<title>M-Pesa Paybill Deposit</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  /* We will remove the gradient background from the body */
  background-color: #330055; /* Set a solid background color for the body if container doesn't cover everything */
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh; /* Make body take full viewport height */
  width: 100vw; /* Make body take full viewport width */
  overflow: hidden; /* Prevent scrolling if content slightly exceeds viewport */
}

.container {
  background-color: #330055; /* This will now be the main background color for the 'full screen' form */
  padding: 20px;
  /* border-radius: 10px; */ /* Removed border-radius as you want it to be full screen */
  /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); */ /* Removed box-shadow for a cleaner full-screen look */
  text-align: center;
  width: 100%; /* Make container full width */
  height: 100vh; /* Make container full viewport height */
  box-sizing: border-box; /* Include padding in the width/height calculation */
  display: flex; /* Use flexbox to center content vertically within the container */
  flex-direction: column; /* Stack items vertically */
  justify-content: center; /* Center content vertically */
  align-items: center; /* Center content horizontally */
}

h1, h2 {
  margin-bottom: 10px;
}

input[type="number"],
input[type="text"] {
  width: calc(100% - 40px); /* Adjusted for 20px padding on each side inside the inputs */
  padding: 15px; /* Increased padding for inputs */
  margin-bottom: 15px; /* Increased margin for inputs */
  background-color: #440066;
  color: white;
  border: none;
  border-radius: 5px;
  text-align: center;
  box-sizing: border-box;
  font-size: 1.1em; /* Make input text slightly larger */
}

button {
  background-color: #9900cc;
  color: white;
  padding: 18px 35px; /* Increased button padding for a larger size */
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1.2em; /* Make button text larger */
  margin-top: 20px; /* Add some space above the button */
}

.instructions {
  text-align: left;
  margin-top: 0; /* Remove top margin as the flexbox will handle vertical spacing */
  margin-bottom: 25px; /* Add more space below instructions */
  padding: 20px; /* Increased padding for instructions */
  border: 1px solid #7700aa;
  border-radius: 8px; /* Slightly larger border-radius for instructions */
  font-size: 1.2em; /* Make instruction text larger */
  width: calc(100% - 40px); /* Match width with inputs, accounting for padding */
  box-sizing: border-box;
}

.instructions ol {
  padding-left: 30px; /* Adjust padding for ordered list */
}

.input-group {
  display: flex;
  flex-direction: column;
  width: calc(100% - 40px); /* Match width with inputs and instructions */
  margin-bottom: 15px; /* Increased margin between input groups */
}

.input-group label {
  margin-bottom: 10px; /* Increased margin for labels */
  font-size: 1.2em; /* Make label text larger */
}

/* Added for better centering and to make the inner content responsive within the full screen */
.content-wrapper {
  max-width: 500px; /* Set a max-width for the form content to prevent it from becoming too wide on very large screens */
  width: 90%; /* Allow content to take up a good portion of the screen */
  padding: 20px; /* Add some padding inside this wrapper */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center; /* Center items within the wrapper */
}
</style>
</head>
<body>
  <div class="container">
    <div class="content-wrapper">
      <h1>M-Pesa Paybill Deposit</h1>

      <div class="instructions">
        <h2>Instructions:</h2>
        <ol>
          <li>Go to M-Pesa on your phone.</li>
          <li>Select "Lipa na M-Pesa".</li>
          <li>Choose "Pay Bill".</li>
          <li>Enter Business Number: <b>247247</b></li>
          <li>Enter Account Number: <b>20062359741</b></li>
          <li>Enter Account Name: <b>Dennis</b></li>
          <li>Enter your M-Pesa PIN.</li>
        </ol>
      </div>

      <div class="input-group">
        <label for="amount">Enter Amount:</label>
        <input type="number" id="amount" placeholder="Amount">
      </div>
      <div class="input-group">
        <label for="phoneNumber">Phone Number:</label>
        <input type="text" id="phoneNumber" placeholder="Phone Number">
      </div>
      <div class="input-group">
        <label for="transactionCode">Transaction Code:</label>
        <input type="text" id="transactionCode" placeholder="Transaction Code">
      </div>

      <button onclick="depositConfirmation()">Confirm Deposit</button>
    </div>
  </div>

  <script>
    function depositConfirmation() {
      const amount = document.getElementById("amount").value;
      const phoneNumber = document.getElementById("phoneNumber").value;
      const transactionCode = document.getElementById("transactionCode").value;

      if (amount === "" || phoneNumber === "" || transactionCode === "") {
        alert("Please fill in all fields.");
        return;
      }

      alert("Thank you! Your deposit is being processed.\nAmount: " + amount + "\nPhone Number: " + phoneNumber + "\nTransaction Code: " + transactionCode + "\nPaybill Details:\nPaybill Number: 247247\nAccount Number: 20062359741\nAccount Name: Dennis");
      // In a real application, you would send this information to your server
      // to verify the payment.  This is just a placeholder.
    }
  </script>
</body>
</html>
