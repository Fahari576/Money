<!DOCTYPE html>
<html>
<head>
<title>M-Pesa Paybill Deposit</title>
<style>
body {
  font-family: sans-serif;
  margin: 0;
  background-color: #330055; /* Dark purple background */
  color: white;
  display: flex;
  justify-content: center;
  align-items: flex-start; /* Align to the top, as in the image */
  min-height: 100vh;
  width: 100vw;
  overflow-y: auto; /* Allow vertical scrolling if content exceeds viewport height */
  padding-top: 20px; /* Add some padding at the top */
  box-sizing: border-box;
}

.container {
  background-color: #330055; /* Same as body background for a seamless look */
  padding: 0; /* No padding on the container itself */
  text-align: center;
  width: 100%;
  max-width: 500px; /* Limit the maximum width of the content */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  margin-top: 10px; /* Adjust margin to match image */
  margin-bottom: 20px;
  font-size: 1.4em; /* Match the title size */
}

.instructions {
  background-color: #4A0077; /* Slightly lighter purple for the instructions box */
  text-align: left;
  margin-top: 0;
  margin-bottom: 25px;
  padding: 15px; /* Adjust padding to match the image */
  border-radius: 8px;
  font-size: 0.9em; /* Match instruction text size */
  width: calc(100% - 40px); /* Account for horizontal padding */
  box-sizing: border-box;
}

.instructions h2 {
  font-size: 1.1em; /* Match "Instructions:" heading size */
  margin-top: 0;
  margin-bottom: 10px;
}

.instructions ol {
  padding-left: 20px; /* Adjust padding for ordered list */
  margin: 0;
  list-style-position: inside; /* Keep list markers inside */
}

.instructions li {
  margin-bottom: 5px;
}

/* Styling for actual input fields */
input[type="number"],
input[type="text"] {
  width: calc(100% - 40px); /* Match the width of the instructions box */
  padding: 15px 20px; /* Adjust padding */
  margin-bottom: 15px;
  background-color: #4A0077; /* The background color of the input area */
  color: white; /* Changed to white for user input */
  border: none;
  border-radius: 5px;
  text-align: center;
  box-sizing: border-box;
  font-size: 1.1em;
}

/* Placeholder text color */
input::placeholder {
  color: #bbb;
  opacity: 1; /* Firefox fix */
}

button {
  background-color: #9900CC; /* Purple button color */
  color: white;
  padding: 15px 30px; /* Adjust button padding to match image */
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1.1em; /* Match button text size */
  margin-top: 10px; /* Adjust space above the button */
  width: calc(100% - 40px); /* Match the width of other elements */
  max-width: 300px; /* Limit button width */
}
</style>
</head>
<body>
  <div class="container">
    <h1>M-Pesa Paybill Deposit</h1>

    <div class="instructions">
      <h2>Instructions:</h2>
      <ol>
        <li>Go to M-Pesa on your phone.</li>
        <li>Select "Lipa na M-Pesa".</li>
        <li>Choose "Pay Bill".</li>
        <li>Enter Business Number: <b>247247</b></li>
        <li>Enter Account Number: <b>20062359741</b></li>
        <li>Enter Account Name: <b>Dennis</b></li>
        <li>Enter your M-Pesa PIN.</li>
      </ol>
    </div>

    <input type="number" id="amount" placeholder="Enter Amount">
    <input type="text" id="phoneNumber" placeholder="Phone Number">
    <input type="text" id="transactionCode" placeholder="Transaction Code">

    <button onclick="depositConfirmation()">Confirm Deposit</button>
  </div>

  <script>
    function depositConfirmation() {
      const amount = document.getElementById('amount').value;
      const phoneNumber = document.getElementById('phoneNumber').value;
      const transactionCode = document.getElementById('transactionCode').value;

      if (amount && phoneNumber && transactionCode) {
        alert(`Confirming deposit:\nAmount: KES ${amount}\nPhone: ${phoneNumber}\nTransaction Code: ${transactionCode}`);
      } else {
        alert("Please fill in all the details.");
      }
    }
  </script>
</body>
</html>
